.fine{fill:none;stroke:#3D4752;stroke-width:1.4;stroke-linecap:round}
.hal{display:none;fill:none;stroke:#FFB000;stroke-opacity:.45;stroke-width:14;stroke-linejoin:round}
.mk{display:none}
.mk line{stroke:#B37A00;stroke-width:2.5}
.mk circle{fill:#B37A00}
.mk text{fill:#FFFFFF;font:700 16px sans-serif;text-anchor:middle}
