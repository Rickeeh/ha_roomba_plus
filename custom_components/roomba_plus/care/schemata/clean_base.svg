<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img"><title>Clean Base</title><style>
.body{fill:#EEF1F4;stroke:#3D4752;stroke-width:3}
.ln{fill:none;stroke:#3D4752;stroke-linecap:round;stroke-linejoin:round}
